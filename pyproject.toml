[project]
name = "triage-ai"
version = "1.0.0"
description = "An open-source, asynchronous B2B workflow automation platform that triages customer support emails using LangGraph, RAG, and external ticketing APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator==2.2.0",
    "fastapi==0.136.3",
    "pydantic==2.13.2",
    "pypdf==5.6.0",
    "python-dotenv==1.1.1",
    "supabase==2.15.0",
    "uvicorn==0.48.0",
    "python-multipart==0.0.20",
    "pyjwt==2.10.1",
    "cryptography==45.0.5",
    "requests>=2.34.2",
    "tenacity>=9.1.2",
    "langchain>=1.3.4",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.4.2",
    "langchain-chroma>=1.1.0",
    "langgraph>=1.2.4",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "dotenv>=0.9.9",
]
